name: docs-adr

# ADR 号段、引用可解析、相对链接、生成物有没有被手改，以及有没有把真实姓名／手机号／订单号写进代码与文档。
# 故意不加 paths 过滤：引用就写在 .py / .ts / .vue 的注释里，任何代码 PR 都必须过这一关。
# 本地等价执行：同样这四条命令（见 docs/agents/shared-rules.md §1.4 与 §3.4）。

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-adr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 校验号段 / 引用可解析 / 相对链接
        run: node scripts/adr.mjs check

      - name: 重新生成索引
        run: node scripts/adr.mjs index

      - name: 生成物不许手改
        run: |
          if ! git diff --exit-code docs/adr/README.md CONTEXT-MAP.md; then
            echo "::error::CONTEXT-MAP.md 或 docs/adr/README.md 与生成结果不一致：要么被手改了，要么改完 domains.json / ADR 没跑 index。本地修法：node scripts/adr.mjs index && git add CONTEXT-MAP.md docs/adr/README.md"
            git --no-pager diff --stat docs/adr/README.md CONTEXT-MAP.md
            exit 1
          fi

      # 规则正文见 docs/agents/shared-rules.md §3.4。豁免底账已在 2026-11-12 降到 0 条并删除，此后命中只有「改」一条路。
      - name: 可识别到个人的真实信息（姓名 / 手机号 / 订单号 / 本机路径）
        run: node scripts/pii.mjs
