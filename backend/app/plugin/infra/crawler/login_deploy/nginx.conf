pid /tmp/login-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    map $http_x_forwarded_proto $login_scheme {
        default $scheme;
        https https;
    }
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/login-client;
    proxy_temp_path /tmp/login-proxy;
    fastcgi_temp_path /tmp/login-fastcgi;
    uwsgi_temp_path /tmp/login-uwsgi;
    scgi_temp_path /tmp/login-scgi;
    client_max_body_size 4k;
    server {
        listen 8080;
        auth_request /_auth;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        location = /_auth {
            internal;
            auth_request off;
            proxy_pass http://127.0.0.1:6081/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
        location = /entry {
            auth_request off;
            proxy_pass http://127.0.0.1:6081/entry;
        }
        location = /access/exchange {
            auth_request off;
            proxy_pass http://127.0.0.1:6081/exchange;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $login_scheme;
        }
        location = / { root /opt/login/web; try_files /index.html =404; }
        location /control/ {
            proxy_pass http://127.0.0.1:6081/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $login_scheme;
            proxy_read_timeout 80s;
        }
        location = /viewer/websockify {
            if ($http_origin != "$login_scheme://$http_host") { return 403; }
            proxy_pass http://127.0.0.1:6081/vnc;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $login_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1000s;
        }
        location /viewer/ {
            proxy_pass http://127.0.0.1:6080/;
            proxy_set_header Upgrade "";
            proxy_set_header Connection "";
        }
    }
}
