# Included inside the existing login gateway's server block.
# This route requires the independent backend service credential, not the UI cookie.
location /collector/v1/sessions/ {
    auth_request off;
    client_max_body_size 4k;
    rewrite ^/collector/v1/(.*)$ /v1/$1 break;
    proxy_pass http://127.0.0.1:6081;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 10s;
    proxy_next_upstream off;
}
location /collector/v1/ {
    auth_request off;
    client_max_body_size 8k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $product_jobs_upstream product-jobs:8090;
    rewrite ^/collector/v1/(.*)$ /v1/$1 break;
    proxy_pass http://$product_jobs_upstream;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_next_upstream off;
}
