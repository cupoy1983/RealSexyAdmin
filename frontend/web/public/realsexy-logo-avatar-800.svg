<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">RealSexy square avatar logo</title>
  <desc id="desc">A square burgundy and champagne-gold RealSexy logo for avatar use.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7DFA7"/>
      <stop offset="0.52" stop-color="#C99B52"/>
      <stop offset="1" stop-color="#8D5B25"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F0"/>
      <stop offset="1" stop-color="#F2E3D3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" rx="112" fill="url(#bg)"/>
  <circle cx="400" cy="286" r="194" fill="#651E35"/>

  <!-- Compact emblem: readable as an R and a heart at avatar size. -->
  <g transform="translate(308 176) scale(1.18)">
    <path d="M92 8C44 8 12 39 12 82c0 44 34 82 80 112 46-30 80-68 80-112 0-43-32-74-80-74Z"
      fill="none" stroke="#F7DFA7" stroke-width="9"/>
    <path d="M92 170V47c0-22-17-35-40-35H25M53 12c39 0 65 18 65 49 0 29-25 47-65 47H25"
      fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M83 108l69 65" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <text x="400" y="586" text-anchor="middle" fill="#651E35"
    font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700"
    letter-spacing="2.5">RealSexy</text>
  <path d="M168 622H632" stroke="#651E35" stroke-width="3" opacity=".35"/>
  <text x="400" y="662" text-anchor="middle" fill="#651E35" opacity=".76"
    font-family="Arial, sans-serif" font-size="17" letter-spacing="7">REAL YOU</text>
</svg>
